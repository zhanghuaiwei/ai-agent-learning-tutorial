site_name: AI Agent 应用开发工程师学习教程
site_description: 面向前端工程师转型 AI Agent 应用开发的能力门槛制企业级教程
site_author: zhanghuaiwei
site_url: https://zhanghuaiwei.github.io/ai-agent-learning-tutorial/
repo_url: https://github.com/zhanghuaiwei/ai-agent-learning-tutorial
repo_name: zhanghuaiwei/ai-agent-learning-tutorial
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

copyright: Copyright &copy; 2026 zhanghuaiwei · MIT License

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zhanghuaiwei
      name: GitHub
